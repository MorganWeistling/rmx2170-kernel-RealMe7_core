name: Build RMX2170 Kernel (KernelSU-Next + SUSFS)

# Realme 7 Pro (RMX2170) — atoll / SD720G — kernel 4.14
# One-click build on GitHub Actions. Outputs an AnyKernel3 flashable zip.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source git URL"
        required: true
        default: "https://github.com/sm7125/android_kernel_realme_sm7125"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "aex9"
      defconfig:
        description: "defconfig name (relative to arch/arm64/configs)"
        required: true
        default: "vendor/atoll-perf_defconfig"
      enable_ksu:
        description: "Integrate KernelSU-Next"
        type: boolean
        default: true
      enable_susfs:
        description: "Apply SUSFS (requires KernelSU-Next)"
        type: boolean
        default: true
      clang_repo:
        description: "Proton clang git URL (used when toolchain=proton)"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      toolchain:
        description: "Toolchain: proton (sm7125/AOSP-ROM trees) or aosp (stock Oplus tree)"
        type: choice
        options: [proton, aosp]
        default: proton
      vendor_graft:
        description: "Graft missing Oplus files from sibling dump (stock tree only)"
        type: boolean
        default: false

env:
  ARCH: arm64
  # Stock-looking identity so /proc/version doesn't scream "self-built".
  KBUILD_BUILD_USER: root
  KBUILD_BUILD_HOST: localhost

jobs:
  build:
    # Pinned to 22.04: Proton clang's bundled ld (2022) can't link host tools
    # against Ubuntu 24.04's glibc (.relr.dyn sections). 22.04 glibc 2.35 is fine.
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libncurses-dev \
            build-essential ccache zip python3 cpio kmod \
            device-tree-compiler libelf-dev wiggle \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          # Vendor (Oplus/Realme) trees wrap CC in a python script and their
          # compiler-check scripts invoke $(CROSS_COMPILE)gcc directly, so the
          # GNU cross toolchains must be present even when we compile with clang.

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" kernel
          echo "Kernel HEAD: $(git -C kernel rev-parse HEAD)"

      - name: Graft missing Oplus feature files from sibling dump
        if: ${{ inputs.vendor_graft }}
        # The atoll 6pro/7pro/8pro/X2 open-source release drops several Oplus
        # feature files (headers woven into core code) that ARE published in the
        # sibling realme6/7/Narzo AndroidR dump. Copy the real files over so
        # they compile instead of being empty-stubbed. Off for sm7125/AOSP trees.
        working-directory: kernel
        shell: bash
        run: |
          set +e
          SIBURL=https://github.com/realme-kernel-opensource/realme6_6s_6i_7__nazro_30_20Pro__AndroidR-kernel-source
          git clone --depth=1 "$SIBURL" ../sibling || { echo "::warning::sibling clone failed"; exit 0; }
          SIB=../sibling
          graft() {
            local p="$1"
            if [ -e "$SIB/$p" ] || [ -L "$SIB/$p" ]; then
              [ -L "${p%/}" ] && rm -f "${p%/}"
              rm -rf "$p"; mkdir -p "$(dirname "$p")"
              cp -a "$SIB/$p" "$p" && echo "grafted $p"
            else
              echo "sibling lacks $p (skip)"
            fi
          }
          graft include/linux/uifirst
          graft include/linux/oppo_healthinfo
          graft kernel/oppo_special_opt
          graft mm/oppo_healthinfo
          graft fs/proc/oppo_healthinfo
          graft fs/osdcardfs
          rm -rf "$SIB/.git"

      - name: Clone Proton clang toolchain
        if: ${{ inputs.toolchain == 'proton' }}
        run: |
          git clone --depth=1 "${{ inputs.clang_repo }}" clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Download AOSP clang + Android GCC toolchains
        if: ${{ inputs.toolchain == 'aosp' }}
        # Realme/Oplus AndroidR tree is built by the OEM with AOSP clang and the
        # aarch64-linux-android- triple (see /proc/version: "clang for Android
        # NDK"). Proton clang + the gnu triple fails the tree's clang detection,
        # so we fetch the Android-11 clang (r383902b) and GCC 4.9 prebuilts.
        run: |
          AOSP=https://android.googlesource.com/platform/prebuilts
          BR=refs/heads/android11-release
          mkdir -p clang gcc64 gcc32
          echo "Fetching AOSP clang r383902b ..."
          curl -Ls "$AOSP/clang/host/linux-x86/+archive/$BR/clang-r383902b.tar.gz" | tar -xz -C clang
          echo "Fetching aarch64-linux-android-4.9 ..."
          curl -Ls "$AOSP/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/$BR.tar.gz" | tar -xz -C gcc64
          echo "Fetching arm-linux-androideabi-4.9 ..."
          curl -Ls "$AOSP/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/$BR.tar.gz" | tar -xz -C gcc32
          test -x clang/bin/clang || { echo "::error::clang download failed"; ls -la clang; exit 1; }
          # Android 11 GCC 4.9 prebuilt ships binutils only (no gcc driver); we
          # compile with clang and only need its assembler/linker + libs, so
          # check for ld rather than gcc.
          test -x gcc64/bin/aarch64-linux-android-ld || { echo "::error::gcc64 download failed"; ls -la gcc64/bin | head; exit 1; }
          echo "clang: $(clang/bin/clang --version | head -1)"
          {
            echo "$GITHUB_WORKSPACE/clang/bin"
            echo "$GITHUB_WORKSPACE/gcc64/bin"
            echo "$GITHUB_WORKSPACE/gcc32/bin"
          } >> "$GITHUB_PATH"

      # ---- KernelSU (original, non-GKI + SUSFS) --------------------------
      - name: Integrate KernelSU
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        shell: bash
        run: |
          # SUSFS's susfs4ksu patch is built for ORIGINAL KernelSU (tiann), not
          # KSU-Next (whose refactored layout the patch can't apply to). KSU v1.0
          # dropped non-GKI support (commit 898e9d4); per the susfs4ksu README we
          # pin a 1.0.x tag, revert that commit to restore 4.14, disable kprobe
          # hooks, and add manual hooks.
          KSU_TAG=v1.0.0   # the drop-non-GKI commit is this release's tip, so the revert applies cleanly
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_TAG}/kernel/setup.sh" | bash -s "$KSU_TAG"
          echo "KSU version: $(git -C KernelSU describe --tags 2>/dev/null || echo n/a)"
          # Restore non-GKI support (reverse the drop-non-GKI commit).
          REVURL="https://github.com/tiann/KernelSU/commit/898e9d4f8ca9b2f46b0c6b36b80a872b5b88d899.diff"
          curl -sL "$REVURL" -o /tmp/dropngki.diff
          ( cd KernelSU && { git apply -R /tmp/dropngki.diff || patch -p1 -R --fuzz=3 < /tmp/dropngki.diff; } \
            && echo "reverted drop-non-GKI" || echo "::warning::non-GKI revert had rejects" )
          # Use KernelSU's native KPROBE hooks (CONFIG_KPROBES=y). They cover ALL
          # interception incl. the prctl manager-comms channel and work on 4.14.
          # (The earlier "disable kprobes + manual hooks" path broke manager
          # comms, so we do NOT disable them and do NOT add manual hooks.)
          # Wire into the build (setup.sh usually does this; keep as a safety net).
          test -e drivers/kernelsu/Kconfig || ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'kernelsu' drivers/Makefile \
            || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          echo "=== wiring check ==="
          grep -n 'kernelsu' drivers/Kconfig drivers/Makefile || { echo "::error::KSU wiring failed"; exit 1; }
          echo "config KSU in sourced Kconfig: $(grep -c '^config KSU$' drivers/kernelsu/Kconfig 2>/dev/null)"
          # pgtable.h compat (harmless on 4.14 if some file wants the 5.8 split).
          [ -e include/linux/pgtable.h ] || printf '#ifndef _LINUX_PGTABLE_SHIM\n#define _LINUX_PGTABLE_SHIM\n#include <asm/pgtable.h>\n#endif\n' > include/linux/pgtable.h
          # No manual hooks — native kprobe hooks handle interception.

      # ---- SUSFS ---------------------------------------------------------
      # Non-GKI MSM-4.14 flow: copy susfs fs/ + headers, apply the kernel patch,
      # then let KernelSU-Next's own susfs support pick up CONFIG_KSU_SUSFS.
      - name: Apply SUSFS patches
        if: ${{ inputs.enable_ksu && inputs.enable_susfs }}
        working-directory: kernel
        run: |
          git clone --depth=1 -b kernel-4.14 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu || \
          git clone --depth=1 -b kernel-4.14 \
            https://github.com/Star-Seven/susfs4ksu.git ../susfs4ksu
          SUS=../susfs4ksu
          # kernel-side files
          cp "$SUS"/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp "$SUS"/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          # main kernel patch
          PATCH=$(ls "$SUS"/kernel_patches/50_add_susfs_in_*4.14*.patch | head -n1)
          echo "Applying $PATCH"
          patch -p1 --fuzz=3 < "$PATCH" || true
          # The aex9 tree drifts context near some hunks, so a few reject. Every
          # susfs hunk is an additive #ifdef CONFIG_KSU_SUSFS_* block, so wiggle
          # (word-level fuzzy merge) can place them safely. KSU-side files
          # (kernel/selinux/*, kernel/Makefile) are allowed to stay rejected —
          # KernelSU-Next provides susfs's control side natively.
          for rej in $(find . -name '*.rej'); do
            tgt="${rej%.rej}"
            case "$tgt" in
              ./kernel/selinux/*|./kernel/Makefile) echo "skip KSU-side $rej"; continue;;
            esac
            echo "wiggle -> $tgt"
            # wiggle --merge --replace applies the reject with word-level fuzzy
            # matching, writing the merged result back into $tgt.
            if wiggle --merge --replace "$tgt" "$rej"; then rm -f "$rej"; fi
          done
          find . -name '*.porig' -delete 2>/dev/null || true
          # Fail hard if any core hunk is still unresolved or left conflict markers.
          REJ=$(find fs include -name '*.rej' 2>/dev/null || true)
          CONFLICT=$(grep -rl '^<<<<<<<' fs include 2>/dev/null || true)
          if [ -n "$REJ$CONFLICT" ]; then
            echo "::error::susfs core hunks unresolved:"
            for f in $REJ; do echo "===== REJECT $f ====="; cat "$f"; done
            for f in $CONFLICT; do echo "===== CONFLICT in $f ====="; grep -n '<<<<<<<\|>>>>>>>\|=======' "$f"; done
            exit 1
          fi
          echo "All core susfs hunks applied cleanly."
          # susfs' fdinfo.c hunk calls inotify_mark_user_mask() (added to mainline
          # after 4.14); it returns exactly mark->mask & IN_ALL_EVENTS, which the
          # surrounding code already computes as `mask`. Rewrite it for 4.14.
          # The susfs fdinfo hunk (minor: hides inotify watch paths) does not
          # merge cleanly onto this tree and only adds cosmetic hiding. Restore
          # the original file — the rest of SUS_MOUNT hiding works via
          # namespace.c/proc etc.
          git checkout -- fs/notify/fdinfo.c 2>/dev/null && echo "restored original fs/notify/fdinfo.c" || true
          # Apply the KSU-side susfs patch (adds config KSU_SUSFS* + susfs
          # integration to KernelSU/kernel/*). This is built for original KSU's
          # layout, so it should apply cleanly here.
          if [ "${{ inputs.enable_susfs }}" = "true" ] && [ -d KernelSU ]; then
            KP=$(ls "$SUS"/kernel_patches/KernelSU*/*enable_susfs*.patch 2>/dev/null | head -n1)
            if [ -n "$KP" ]; then
              echo "Applying KSU-side susfs patch: $KP"
              ( cd KernelSU && patch -p1 --fuzz=3 < "../$KP" || echo "::warning::KSU susfs patch had rejects" )
              for rej in $(find KernelSU -name '*.rej'); do
                tgt="${rej%.rej}"
                echo "wiggle KSU -> $tgt"
                if wiggle --merge --replace "$tgt" "$rej"; then rm -f "$rej"; fi
              done
              find KernelSU -name '*.porig' -delete 2>/dev/null || true
              grep -q 'KSU_SUSFS' KernelSU/kernel/Kconfig \
                || { echo "::error::KSU_SUSFS not added to KernelSU Kconfig"; exit 1; }
              echo "KSU-side susfs patch applied; KSU_SUSFS present in Kconfig."
            fi
          fi

      - name: Enable KSU / SUSFS config options
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          CFG="arch/arm64/configs/${{ inputs.defconfig }}"
          {
            # legacy KSU-Next uses kprobe hooks, which need CONFIG_KPROBES.
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KSU=y"
          } >> "$CFG"
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            } >> "$CFG"
          fi

      - name: Stub missing vendor Kconfig sources
        # Oplus/Realme open-source dumps reference Kconfig files they forgot to
        # publish (e.g. block/oppo_foreground_io_opt/Kconfig), which aborts the
        # Kconfig parser. Create an empty stub for every `source <path>/Kconfig`
        # whose target is missing. The matching Makefile obj-$(CONFIG_*) stays
        # empty because the config is never defined, so nothing extra is built.
        working-directory: kernel
        shell: bash
        run: |
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            while IFS= read -r kc; do
              case "$kc" in *'$'*) continue;; esac   # skip variable paths
              if [ ! -f "$kc" ]; then
                # Some dumps ship a path component as a stray file/broken symlink
                # where a directory is expected; replace it with a real dir.
                # -L catches dangling symlinks ([ -e ] is false for those).
                d="$(dirname "$kc")"
                if [ -L "$d" ] || { [ -e "$d" ] && [ ! -d "$d" ]; }; then rm -f "$d"; fi
                mkdir -p "$d"
                if [ -L "$kc" ] || { [ -e "$kc" ] && [ ! -f "$kc" ]; }; then rm -rf "$kc"; fi
                : > "$kc"
                echo "stub -> $kc"; changed=1
              fi
            done < <(grep -rhoE '^[[:space:]]*source[[:space:]]+"?[A-Za-z0-9_./-]+/Kconfig[A-Za-z0-9_.-]*"?' \
                       --include='Kconfig*' . | sed -E 's/^[[:space:]]*source[[:space:]]+//; s/"//g' | sort -u)
          done
          echo "Kconfig source stubs complete."

      - name: Stub missing vendor module Makefiles
        # Realme also dropped several Oplus module dirs referenced by
        # `obj-$(CONFIG_x) += dir/` (mm/oppo_healthinfo, fs/osdcardfs, ...).
        # Create an empty Makefile for any referenced subdir that lacks one so
        # kbuild can descend without building anything from the absent feature.
        working-directory: kernel
        shell: bash
        run: |
          set +e +o pipefail   # greps legitimately find nothing in most files
          find . \( -name Makefile -o -name Kbuild \) | while IFS= read -r mf; do
            dir=$(dirname "$mf")
            subs=$(grep -oE 'obj-[^=]*\+?=[[:space:]]*[A-Za-z0-9_./-]+/' "$mf" 2>/dev/null \
                     | grep -oE '[A-Za-z0-9_./-]+/$')
            for sub in $subs; do
              p="$dir/$sub"; pd="${p%/}"
              if [ ! -f "${p}Makefile" ] && [ ! -f "${p}Kbuild" ]; then
                # dumps ship some dirs as dangling symlinks/files; replace them
                if [ -L "$pd" ] || { [ -e "$pd" ] && [ ! -d "$pd" ]; }; then rm -f "$pd"; fi
                mkdir -p "$p"; : > "${p}Makefile"
                echo "stub Makefile -> ${p}Makefile"
              fi
            done
          done
          echo "Vendor module Makefile stubs complete."

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          if [ "${{ inputs.toolchain }}" = "aosp" ]; then
            CROSS=aarch64-linux-android-; CROSS32=arm-linux-androideabi-
          else
            CROSS=aarch64-linux-gnu-; CROSS32=arm-linux-gnueabi-
          fi
          MAKE_ARGS="ARCH=arm64 O=out CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$CROSS \
            CROSS_COMPILE_ARM32=$CROSS32 \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS=-Wno-error=incompatible-pointer-types"
          make -j"$(nproc)" $MAKE_ARGS "${{ inputs.defconfig }}" 2>&1 | tee /tmp/defc.log
          # Appending CONFIG_KSU=y to the defconfig proved unreliable (make
          # defconfig drops it). Force-enable in the generated .config with
          # scripts/config, then re-resolve with olddefconfig.
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            echo "=== defconfig warnings mentioning KSU/symbol ==="
            grep -iE 'ksu|unknown symbol|warning:.*symbol' /tmp/defc.log | head -20 || echo "(none)"
            echo "=== scripts/config --state KSU ==="
            chmod +x scripts/config
            ./scripts/config --file out/.config --state KSU || true
            echo "=== KSU wiring diagnostics ==="
            echo "drivers/kernelsu -> $(readlink drivers/kernelsu 2>/dev/null)"
            echo "config KSU in sourced Kconfig: $(grep -c '^config KSU$' drivers/kernelsu/Kconfig 2>/dev/null)"
            grep -n 'kernelsu/Kconfig' drivers/Kconfig || echo "(source line MISSING in drivers/Kconfig)"
            echo "AFTER make defconfig: $(grep -E '^CONFIG_KSU=|^# CONFIG_KSU ' out/.config || echo NONE)"
            chmod +x scripts/config
            KOPTS="--enable KPROBES --enable KSU"
            if [ "${{ inputs.enable_susfs }}" = "true" ]; then
              KOPTS="$KOPTS --enable KSU_SUSFS --enable KSU_SUSFS_SUS_PATH \
                --enable KSU_SUSFS_SUS_MOUNT --enable KSU_SUSFS_SUS_KSTAT \
                --enable KSU_SUSFS_TRY_UMOUNT --enable KSU_SUSFS_SPOOF_UNAME \
                --enable KSU_SUSFS_HAS_MAGIC_MOUNT \
                --enable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
                --enable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
                --enable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
                --enable KSU_SUSFS_ENABLE_LOG --enable KSU_SUSFS_OPEN_REDIRECT"
            fi
            ./scripts/config --file out/.config $KOPTS
            echo "AFTER scripts/config: $(grep -E '^CONFIG_KSU=' out/.config || echo NONE)"
            make -j"$(nproc)" $MAKE_ARGS olddefconfig
            echo "AFTER olddefconfig: $(grep -E '^CONFIG_KSU=' out/.config || echo NONE)"
            echo "=== KSU/SUSFS in final .config ==="
            grep -E '^CONFIG_KSU' out/.config || true
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU still not enabled"; head -5 drivers/kernelsu/Kconfig; exit 1; }
          fi
          make -j"$(nproc)" $MAKE_ARGS
          ls -lh out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          # atoll: A/B device, let AnyKernel auto-detect the boot block
          sed -i 's/device.name1=.*/device.name1=RMX2170/' ak3/anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=auto;/' ak3/anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' ak3/anykernel.sh
          IMG=kernel/out/arch/arm64/boot/Image.gz-dtb
          [ -f "$IMG" ] || IMG=kernel/out/arch/arm64/boot/Image-dtb
          [ -f "$IMG" ] || IMG=kernel/out/arch/arm64/boot/Image.gz
          cp "$IMG" ak3/
          echo "STAMP=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Zip AnyKernel3
        run: |
          cd ak3
          NAME="RMX2170-KSUNext-SUSFS-${STAMP}.zip"
          zip -r9 "../$NAME" . -x ".git*" README.md
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Build SUSFS rules module
        if: ${{ inputs.enable_ksu && inputs.enable_susfs }}
        shell: bash
        run: |
          # This module ONLY applies SUSFS root-hiding rules via ksu_susfs
          # (spoof the kernel uname string, hide the KSU paths, unmount module
          # overlays from apps' view). It does NOT touch verifiedbootstate /
          # flash.locked — leave Verified Boot / Play Integrity prop handling to
          # a dedicated module (PlayIntegrityFix) that the user installs.
          M=hidemod
          mkdir -p "$M"
          cat > "$M/module.prop" <<'EOF'
          id=rmx2170_susfs
          name=RMX2170 SUSFS rules
          version=1.0
          versionCode=1
          author=rmx2170-kernel-CI
          description=Applies ksu_susfs rules on boot (uname spoof, sus_path, try_umount). Props/Play Integrity handled separately by PIF.
          EOF
          sed -i 's/^          //' "$M/module.prop"
          cat > "$M/post-fs-data.sh" <<'EOF'
          #!/system/bin/sh
          # SUSFS hiding via the ksu_susfs tool that ships with the susfs module.
          SF=""
          for c in ksu_susfs /data/adb/ksu/bin/ksu_susfs; do
            command -v "$c" >/dev/null 2>&1 && SF="$c" && break
            [ -x "$c" ] && SF="$c" && break
          done
          [ -z "$SF" ] && SF="$(ls /data/adb/modules/*/ksu_susfs 2>/dev/null | head -1)"
          [ -z "$SF" ] && exit 0
          "$SF" set_uname '4.14.180-perf+' 'default' 2>/dev/null
          for p in /data/adb/ksu /data/adb/ksud /data/adb/modules /data/adb/service.d; do
            "$SF" add_sus_path "$p" 2>/dev/null
          done
          "$SF" add_try_umount /system 1 2>/dev/null
          "$SF" add_try_umount /vendor 1 2>/dev/null
          "$SF" add_try_umount /data/adb/modules 1 2>/dev/null
          "$SF" enable_log 0 2>/dev/null
          EOF
          sed -i 's/^          //' "$M/post-fs-data.sh"
          HNAME="RMX2170-SUSFS-Module-${STAMP}.zip"
          ( cd "$M" && zip -r9 "../$HNAME" . )
          echo "HIDE_ZIP=$HNAME" >> "$GITHUB_ENV"
          echo "built $HNAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Upload hiding module
        if: ${{ inputs.enable_ksu && inputs.enable_susfs }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HIDE_ZIP }}
          path: ${{ env.HIDE_ZIP }}
          retention-days: 30
