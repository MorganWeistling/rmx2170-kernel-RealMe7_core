name: Build RMX2170 Kernel (KernelSU-Next + SUSFS)

# Realme 7 Pro (RMX2170) — atoll / SD720G — kernel 4.14
# One-click build on GitHub Actions. Outputs an AnyKernel3 flashable zip.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source git URL"
        required: true
        default: "https://github.com/sm7125/android_kernel_realme_sm7125"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "aex9"
      defconfig:
        description: "defconfig name (relative to arch/arm64/configs)"
        required: true
        default: "vendor/atoll-perf_defconfig"
      enable_ksu:
        description: "Integrate KernelSU-Next"
        type: boolean
        default: true
      enable_susfs:
        description: "Apply SUSFS (requires KernelSU-Next)"
        type: boolean
        default: true
      clang_repo:
        description: "Proton clang git URL"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"

env:
  ARCH: arm64
  KBUILD_BUILD_USER: gha
  KBUILD_BUILD_HOST: github-actions

jobs:
  build:
    # Pinned to 22.04: Proton clang's bundled ld (2022) can't link host tools
    # against Ubuntu 24.04's glibc (.relr.dyn sections). 22.04 glibc 2.35 is fine.
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libncurses-dev \
            build-essential ccache zip python3 cpio kmod \
            device-tree-compiler libelf-dev wiggle \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          # Vendor (Oplus/Realme) trees wrap CC in a python script and their
          # compiler-check scripts invoke $(CROSS_COMPILE)gcc directly, so the
          # GNU cross toolchains must be present even when we compile with clang.

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" kernel
          echo "Kernel HEAD: $(git -C kernel rev-parse HEAD)"

      - name: Download AOSP clang + Android GCC toolchains
        # Realme/Oplus AndroidR tree is built by the OEM with AOSP clang and the
        # aarch64-linux-android- triple (see /proc/version: "clang for Android
        # NDK"). Proton clang + the gnu triple fails the tree's clang detection,
        # so we fetch the Android-11 clang (r383902b) and GCC 4.9 prebuilts.
        run: |
          AOSP=https://android.googlesource.com/platform/prebuilts
          BR=refs/heads/android11-release
          mkdir -p clang gcc64 gcc32
          echo "Fetching AOSP clang r383902b ..."
          curl -Ls "$AOSP/clang/host/linux-x86/+archive/$BR/clang-r383902b.tar.gz" | tar -xz -C clang
          echo "Fetching aarch64-linux-android-4.9 ..."
          curl -Ls "$AOSP/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/$BR.tar.gz" | tar -xz -C gcc64
          echo "Fetching arm-linux-androideabi-4.9 ..."
          curl -Ls "$AOSP/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/$BR.tar.gz" | tar -xz -C gcc32
          test -x clang/bin/clang || { echo "::error::clang download failed"; ls -la clang; exit 1; }
          # Android 11 GCC 4.9 prebuilt ships binutils only (no gcc driver); we
          # compile with clang and only need its assembler/linker + libs, so
          # check for ld rather than gcc.
          test -x gcc64/bin/aarch64-linux-android-ld || { echo "::error::gcc64 download failed"; ls -la gcc64/bin | head; exit 1; }
          echo "clang: $(clang/bin/clang --version | head -1)"
          {
            echo "$GITHUB_WORKSPACE/clang/bin"
            echo "$GITHUB_WORKSPACE/gcc64/bin"
            echo "$GITHUB_WORKSPACE/gcc32/bin"
          } >> "$GITHUB_PATH"

      # ---- KernelSU-Next -------------------------------------------------
      - name: Integrate KernelSU-Next
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KSU-Next version: $(git -C KernelSU-Next describe --tags 2>/dev/null || echo n/a)"

      # ---- SUSFS ---------------------------------------------------------
      # Non-GKI MSM-4.14 flow: copy susfs fs/ + headers, apply the kernel patch,
      # then let KernelSU-Next's own susfs support pick up CONFIG_KSU_SUSFS.
      - name: Apply SUSFS patches
        if: ${{ inputs.enable_ksu && inputs.enable_susfs }}
        working-directory: kernel
        run: |
          git clone --depth=1 -b kernel-4.14 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu || \
          git clone --depth=1 -b kernel-4.14 \
            https://github.com/Star-Seven/susfs4ksu.git ../susfs4ksu
          SUS=../susfs4ksu
          # kernel-side files
          cp "$SUS"/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp "$SUS"/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          # main kernel patch
          PATCH=$(ls "$SUS"/kernel_patches/50_add_susfs_in_*4.14*.patch | head -n1)
          echo "Applying $PATCH"
          patch -p1 --fuzz=3 < "$PATCH" || true
          # The aex9 tree drifts context near some hunks, so a few reject. Every
          # susfs hunk is an additive #ifdef CONFIG_KSU_SUSFS_* block, so wiggle
          # (word-level fuzzy merge) can place them safely. KSU-side files
          # (kernel/selinux/*, kernel/Makefile) are allowed to stay rejected —
          # KernelSU-Next provides susfs's control side natively.
          for rej in $(find . -name '*.rej'); do
            tgt="${rej%.rej}"
            case "$tgt" in
              ./kernel/selinux/*|./kernel/Makefile) echo "skip KSU-side $rej"; continue;;
            esac
            echo "wiggle -> $tgt"
            # wiggle --merge --replace applies the reject with word-level fuzzy
            # matching, writing the merged result back into $tgt.
            if wiggle --merge --replace "$tgt" "$rej"; then rm -f "$rej"; fi
          done
          find . -name '*.porig' -delete 2>/dev/null || true
          # Fail hard if any core hunk is still unresolved or left conflict markers.
          REJ=$(find fs include -name '*.rej' 2>/dev/null || true)
          CONFLICT=$(grep -rl '^<<<<<<<' fs include 2>/dev/null || true)
          if [ -n "$REJ$CONFLICT" ]; then
            echo "::error::susfs core hunks unresolved:"
            for f in $REJ; do echo "===== REJECT $f ====="; cat "$f"; done
            for f in $CONFLICT; do echo "===== CONFLICT in $f ====="; grep -n '<<<<<<<\|>>>>>>>\|=======' "$f"; done
            exit 1
          fi
          echo "All core susfs hunks applied cleanly."
          # KernelSU-side susfs patch (if present in this susfs release)
          KSU_PATCH=$(ls "$SUS"/kernel_patches/KernelSU*/*.patch 2>/dev/null | head -n1 || true)
          if [ -n "$KSU_PATCH" ] && [ -d KernelSU-Next ]; then
            ( cd KernelSU-Next && patch -p1 < "../$KSU_PATCH" || echo "::warning::KSU susfs patch rejects" )
          fi

      - name: Enable KSU / SUSFS config options
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          CFG="arch/arm64/configs/${{ inputs.defconfig }}"
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_KPROBES_HOOK=y"
          } >> "$CFG"
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
              echo "CONFIG_KSU_SUSFS_SPOOF_BOOTCONFIG=y"
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            } >> "$CFG"
          fi

      - name: Stub missing vendor Kconfig sources
        # Oplus/Realme open-source dumps reference Kconfig files they forgot to
        # publish (e.g. block/oppo_foreground_io_opt/Kconfig), which aborts the
        # Kconfig parser. Create an empty stub for every `source <path>/Kconfig`
        # whose target is missing. The matching Makefile obj-$(CONFIG_*) stays
        # empty because the config is never defined, so nothing extra is built.
        working-directory: kernel
        shell: bash
        run: |
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            while IFS= read -r kc; do
              case "$kc" in *'$'*) continue;; esac   # skip variable paths
              if [ ! -f "$kc" ]; then
                # Some dumps ship a path component as a stray file/broken symlink
                # where a directory is expected; replace it with a real dir.
                # -L catches dangling symlinks ([ -e ] is false for those).
                d="$(dirname "$kc")"
                if [ -L "$d" ] || { [ -e "$d" ] && [ ! -d "$d" ]; }; then rm -f "$d"; fi
                mkdir -p "$d"
                if [ -L "$kc" ] || { [ -e "$kc" ] && [ ! -f "$kc" ]; }; then rm -rf "$kc"; fi
                : > "$kc"
                echo "stub -> $kc"; changed=1
              fi
            done < <(grep -rhoE '^[[:space:]]*source[[:space:]]+"?[A-Za-z0-9_./-]+/Kconfig[A-Za-z0-9_.-]*"?' \
                       --include='Kconfig*' . | sed -E 's/^[[:space:]]*source[[:space:]]+//; s/"//g' | sort -u)
          done
          echo "Kconfig source stubs complete."

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          # Android triple: matches the OEM toolchain the tree expects.
          MAKE_ARGS="ARCH=arm64 O=out CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make -j"$(nproc)" $MAKE_ARGS "${{ inputs.defconfig }}"
          make -j"$(nproc)" $MAKE_ARGS
          ls -lh out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          # atoll: A/B device, let AnyKernel auto-detect the boot block
          sed -i 's/device.name1=.*/device.name1=RMX2170/' ak3/anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=auto;/' ak3/anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/' ak3/anykernel.sh
          IMG=kernel/out/arch/arm64/boot/Image.gz-dtb
          [ -f "$IMG" ] || IMG=kernel/out/arch/arm64/boot/Image-dtb
          [ -f "$IMG" ] || IMG=kernel/out/arch/arm64/boot/Image.gz
          cp "$IMG" ak3/
          echo "STAMP=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Zip AnyKernel3
        run: |
          cd ak3
          NAME="RMX2170-KSUNext-SUSFS-${STAMP}.zip"
          zip -r9 "../$NAME" . -x ".git*" README.md
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
